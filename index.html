    <script type="text/javascript">
        const setOptanonCookie = function (val = true) {
            window.DY = window.DY || {};

            DY.userActiveConsent = {
                accepted: val
            };

            try {
                if (
                    window.DYO &&
                    DYO.ActiveConsent &&
                    typeof DYO.ActiveConsent.updateConsentAcceptedStatus === "function"
                ) {
                    DYO.ActiveConsent.updateConsentAcceptedStatus(val);
                    console.log("[Consent] DYO active consent updated:", val);
                } else {
                    console.warn("[Consent] DYO.ActiveConsent.updateConsentAcceptedStatus is not available yet.");
                }
            } catch (e) {
                console.error("[Consent] Failed to update DYO active consent status.", e);
            }

            try {
                window.localStorage.setItem("userActiveConsent", String(val));
                console.log("[Consent] Saved userActiveConsent to localStorage:", val);
            } catch (e) {
                console.error("[Consent] Could not save userActiveConsent to localStorage.", e);
            }
        };
    </script>
