    <!-- ✅ DY jsession persistence — runs before DY scripts -->
    <script type="text/javascript">
        (function () {
            var COOKIE_NAME = '_dyjsession';
            var LS_KEY = 'dy_jsession_backup';

            function setCookie(name, value, days) {
                var date = new Date();
                date.setTime(date.getTime() + days * 86400000);
                document.cookie =
                    name + '=' + encodeURIComponent(value) +
                    '; expires=' + date.toUTCString() +
                    '; path=/; SameSite=Lax';
            }

            // RESTORE: set cookie from localStorage before DY loads
            try {
                var saved = localStorage.getItem(LS_KEY);
                if (saved) {
                    setCookie(COOKIE_NAME, saved, 365);
                    console.log('[DY jsession] Restored cookie from localStorage:', saved);
                }
            } catch (e) {
                console.error('[DY jsession] localStorage read failed:', e);
            }

            // SAVE: poll for DY.jsession property (not the cookie), then back it up
            var attempts = 0;
            var maxAttempts = 50;
            var pollInterval = setInterval(function () {
                attempts++;
                if (window.DY && DY.jsession) {
                    var value = DY.jsession;
                    try {
                        var existing = localStorage.getItem(LS_KEY);
                        if (!existing) {
                            localStorage.setItem(LS_KEY, value);
                            console.log('[DY jsession] Saved to localStorage:', value);
                        } else {
                            console.log('[DY jsession] localStorage already has value — no overwrite.');
                        }
                    } catch (e) {
                        console.error('[DY jsession] localStorage write failed:', e);
                    }
                    clearInterval(pollInterval);
                } else if (attempts >= maxAttempts) {
                    console.warn('[DY jsession] DY.jsession not found after ' + maxAttempts + ' polls.');
                    clearInterval(pollInterval);
                }
            }, 100);
        })();
    </script>

    <!-- ✅ DY Active Consent — read stored consent + verify cookies before DY loads -->
    <script type="text/javascript">
        window.DY = window.DY || {};
        (function () {
            var storedConsent = false;
            try {
                storedConsent = window.localStorage.getItem("userActiveConsent") === "true";
            } catch (e) {}

            // Test whether cookies are actually writable
            var cookiesEnabled = false;
            try {
                document.cookie = "_dy_consent_test=1; path=/; SameSite=Lax";
                cookiesEnabled = document.cookie.indexOf("_dy_consent_test") !== -1;
                // Clean up test cookie
                document.cookie = "_dy_consent_test=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            } catch (e) {}

            var accepted = storedConsent && cookiesEnabled;

            // If localStorage says true but cookies are blocked, revoke stored consent
            if (storedConsent && !cookiesEnabled) {
                console.warn("[DY Consent] localStorage says accepted, but cookies are blocked — revoking consent.");
                try {
                    window.localStorage.setItem("userActiveConsent", "false");
                } catch (e) {}
            }

            DY.userActiveConsent = { accepted: accepted };
            console.log("[DY Consent] Init — stored:", storedConsent, "| cookies enabled:", cookiesEnabled, "| accepted:", accepted);
        })();
    </script>

    <script type="text/javascript">
        window.DY = window.DY || {};
        DY.recommendationContext = {type: 'HOMEPAGE', data:[]};
    </script>
    <script type="text/javascript" src="//cdn-eu.dynamicyield.com/api/9882073/api_dynamic.js"></script>
    <script type="text/javascript" src="//cdn-eu.dynamicyield.com/api/9882073/api_static.js"></script>
    <script type="text/javascript">
        const setOptanonCookie = (val = true) => {
            // If accepting, verify cookies are writable first
            if (val) {
                try {
                    document.cookie = "_dy_consent_test=1; path=/; SameSite=Lax";
                    var cookiesEnabled = document.cookie.indexOf("_dy_consent_test") !== -1;
                    document.cookie = "_dy_consent_test=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                    if (!cookiesEnabled) {
                        console.warn("[DY Consent] Cannot accept — cookies are blocked.");
                        return false;
                    }
                } catch (e) {
                    console.warn("[DY Consent] Cookie test failed — cannot accept.");
                    return false;
                }
            }

            DY.userActiveConsent = {
                accepted: val
            };
            DYO.ActiveConsent.updateConsentAcceptedStatus(val);

            try {
                window.localStorage.setItem("userActiveConsent", val);
            }
            catch (e) {
                console.error("We couldn't save the value of the consent");
            }

            return val;
        };
    </script>

    <!-- ===== DY Consent Toggle ===== -->
    <div id="dy-consent-banner" style="
        position: fixed; bottom: 20px; right: 20px; z-index: 99999;
        background: #1a1a2e; color: #fff; padding: 14px 20px;
        border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        font-family: Arial, sans-serif; font-size: 14px;
        display: flex; align-items: center; gap: 12px;
    ">
        <span>DY Consent: <strong id="dy-consent-status"></strong></span>
        <button id="dy-consent-btn" style="
            padding: 8px 16px; border: none; border-radius: 6px;
            font-weight: bold; font-size: 14px; cursor: pointer;
        "></button>
    </div>

    <script>
    (function () {
        var statusEl = document.getElementById("dy-consent-status");
        var btnEl    = document.getElementById("dy-consent-btn");

        function isAccepted() {
            try {
                return window.localStorage.getItem("userActiveConsent") === "true";
            } catch (e) {
                return false;
            }
        }

        function render(accepted) {
            statusEl.textContent   = accepted ? "Accepted ✅" : "Not Accepted ❌";
            btnEl.textContent      = accepted ? "Reject Consent" : "Accept Consent";
            btnEl.style.background = accepted ? "#e74c3c" : "#2ecc71";
            btnEl.style.color      = "#fff";
        }

        // Initial render from localStorage
        render(isAccepted());

        btnEl.addEventListener("click", function () {
            var newVal = !isAccepted();

            // setOptanonCookie returns false if cookies are blocked
            var result = setOptanonCookie(newVal);

            if (result === false) {
                alert("Cookies are blocked by your browser. Consent cannot be granted.");
                render(false);
            } else {
                render(newVal);
            }

            console.log("[DY Consent] Toggled to:", newVal,
                "| isUserOptOut:", (typeof DYO !== "undefined" && DYO.ActiveConsent)
                    ? DYO.ActiveConsent.isUserOptOut()
                    : "DYO not loaded"
            );
        });
    })();
    </script>
